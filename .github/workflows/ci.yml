name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    # Fast feedback: the JUCE-free DSP/sequencer core, its tests and the benchmark.
    # Linux is not supported for now, so CI does not build or test it.
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFLOORPLAN_BUILD_PLUGIN=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build -C Release --output-on-failure 2>&1 | tee test.log

      - name: Report failing tests
        # Annotations are visible without signing in, unlike the raw log.
        if: failure()
        shell: bash
        run: |
          [ -f test.log ] || exit 0
          grep -E "FAILED |\(.* vs .*\)|\*\*\*Failed|tests failed" test.log | sort -u | head -n 20 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Benchmark
        shell: bash
        run: |
          bench=$(find build -type f \( -name floorplan_bench -o -name floorplan_bench.exe \) | head -n 1)
          "$bench"

  plugin:
    name: Plugin (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            configure: ""
          - name: macOS
            os: macos-latest
            configure: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}

      - name: Build
        id: build
        timeout-minutes: 30
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 4 2>&1 | tee build.log

      - name: Report compiler errors
        # Annotations are visible without signing in, unlike the raw log.
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          grep -E "(error|fatal error)( C[0-9]+|LNK[0-9]+)?:|undefined reference|multiple definition|relocation .* can not be used|recompile with" build.log \
            | sort -u | head -n 9 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          echo "::error title=Build log tail::$(tail -n 40 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build -C Release --output-on-failure 2>&1 | tee test.log

      - name: Report failing tests
        if: failure()
        shell: bash
        run: |
          [ -f test.log ] || exit 0
          grep -E "FAILED |\(.* vs .*\)|\*\*\*Failed|tests failed" test.log | sort -u | head -n 20 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Upload plugin
        uses: actions/upload-artifact@v5
        with:
          name: Floorplan-${{ matrix.name }}
          path: |
            build/Floorplan_artefacts/Release/VST3
            build/Floorplan_artefacts/Release/Standalone
          if-no-files-found: error
          retention-days: 30
