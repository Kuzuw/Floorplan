name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    # Fast feedback: the JUCE-free DSP/sequencer core, its tests and the benchmark.
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFLOORPLAN_BUILD_PLUGIN=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Benchmark
        shell: bash
        run: |
          bench=$(find build -type f \( -name floorplan_bench -o -name floorplan_bench.exe \) | head -n 1)
          "$bench"

  plugin:
    name: Plugin (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            configure: ""
          - name: macOS
            os: macos-latest
            configure: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - name: Linux
            os: ubuntu-24.04
            configure: -G Ninja
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build xvfb \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libgl1-mesa-dev

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 2>&1 | tee build.log

      - name: Report compiler errors
        # Annotations are visible without signing in, unlike the raw log.
        if: failure()
        shell: bash
        run: |
          grep -E "(error|fatal error)( C[0-9]+|LNK[0-9]+)?:|undefined reference|multiple definition|relocation .* can not be used|recompile with" build.log \
            | sort -u | head -n 25 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Test
        if: runner.os != 'Linux'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Test (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build -C Release --output-on-failure

      - name: Upload plugin
        uses: actions/upload-artifact@v5
        with:
          name: Floorplan-${{ matrix.name }}
          path: |
            build/Floorplan_artefacts/Release/VST3
            build/Floorplan_artefacts/Release/Standalone
          if-no-files-found: error
          retention-days: 30
